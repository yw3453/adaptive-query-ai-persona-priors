[project]
name = "adaptive-query-ai-persona-priors"
version = "0.1.0"
description = "Code and data for the paper \"Adaptive Querying with AI Persona Priors\"."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Yuhang Wu" },
]
keywords = [
    "adaptive-querying",
    "bayesian-experimental-design",
    "computerized-adaptive-testing",
    "large-language-models",
    "ai-personas",
    "digital-twin",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "joblib>=1.4.0",
    "matplotlib>=3.10.8",
    "numba>=0.60.0",
    "numpy>=2.0",
    "pandas>=2.3.3",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.13",
    "seaborn>=0.13.2",
    "tqdm>=4.66.0",
]
